name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated runtime and build launcher
        shell: pwsh
        run: ./install.ps1
      - name: Dependency and syntax checks
        shell: pwsh
        run: |
          & ./.runtime/Scripts/python.exe -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./.runtime/Scripts/python.exe -m compileall -q screen.py winprocess.py terminal_input.py release.py verify.py package.py tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check static/app.js
          exit $LASTEXITCODE
      - name: Run Windows tests and record hashes
        shell: pwsh
        run: |
          & ./.runtime/Scripts/python.exe verify.py
          exit $LASTEXITCODE
      - name: Build and verify release ZIP
        shell: pwsh
        run: |
          & ./.runtime/Scripts/python.exe package.py
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-python-${{ matrix.python }}
          path: |
            checks/verification.json
            checks/test_output.log
            dist/*.zip
          if-no-files-found: warn
